name: "PlateVision"
slug: platevision
description: Lokale Kennzeichen-, Fahrzeug- und Personenerkennung für Home Assistant
version: "0.13.14"
url: "https://github.com/richieam93/platevision-ha-addon"
arch:
  - amd64
startup: services
boot: auto
stage: stable
watchdog: "http://[HOST]:5000/api/system/live"
init: false

# Home Assistant embeds the UI through the authenticated Ingress proxy.
ingress: true
ingress_port: 5000
ingress_entry: /
ingress_stream: true
# Allow the add-on to call Home Assistant services via the internal Core API.
homeassistant_api: true
panel_admin: true

# Disabled by default: exposing this port would bypass Home Assistant login.
# A direct network port can be enabled explicitly in the app's Network section.
ports:
  5000/tcp: null
ports_description:
  5000/tcp: "Optional direct access (bypasses Home Assistant authentication)"

panel_icon: "mdi:license"
panel_title: "PlateVision"
