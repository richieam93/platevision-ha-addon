name: Validate PlateVision

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight validators
        run: python -m pip install --disable-pip-version-check jinja2 pyyaml
      - name: Validate source, templates, metadata and model hashes
        run: python tools/validate_release.py
