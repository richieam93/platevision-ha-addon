# PlateVision Lovelace Dashboard

type: vertical-stack
title: 🚗 PlateVision
cards:
  - type: horizontal-stack
    cards:
      - type: entity
        entity: sensor.platevision_kennzeichen_heute
        name: Kennzeichen heute
        icon: mdi:counter
      - type: entity
        entity: sensor.platevision_autos_heute
        name: Autos heute
        icon: mdi:car-multiple
      - type: entity
        entity: sensor.platevision_personen_heute
        name: Personen heute
        icon: mdi:walk

  - type: picture-entity
    entity: camera.platevision_fahrzeug_bild
    camera_image: camera.platevision_fahrzeug_bild
    name: Letztes Auto
    show_state: false

  - type: markdown
    content: |
      ## {{ states('sensor.platevision_kennzeichen') }}
      **{{ states('sensor.platevision_fahrzeugtyp') }}** · {{ states('sensor.platevision_fahrzeugfarbe') }} · {{ states('sensor.platevision_land') }}  
      Konfidenz: {{ states('sensor.platevision_konfidenz') }}%  
      {{ states('sensor.platevision_zuletzt_gesehen') }}

  - type: horizontal-stack
    cards:
      - type: picture-entity
        entity: camera.platevision_person_bild
        camera_image: camera.platevision_person_bild
        name: Letzte Person
        show_state: false
      - type: picture-entity
        entity: camera.platevision_kennzeichen_bild
        camera_image: camera.platevision_kennzeichen_bild
        name: Kennzeichen
        show_state: false

  - type: entities
    title: Stream und Verkehr
    entities:
      - entity: binary_sensor.platevision_stream
        name: Stream verbunden
      - entity: sensor.platevision_durchfahrten_heute
        name: Durchfahrten heute
      - entity: sensor.platevision_wiederkehrer_heute
        name: Wiederkehrer heute
      - entity: sensor.platevision_quelle
        name: Letzte Quelle
