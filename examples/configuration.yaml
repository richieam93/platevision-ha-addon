# PlateVision Home Assistant Beispiel
# Basis-URL anpassen:
#   http://192.168.1.240:8087

rest:
  - resource: http://192.168.1.240:8087/api/latest/plate
    scan_interval: 5
    sensor:
      - name: PlateVision Kennzeichen
        unique_id: platevision_last_plate
        value_template: "{{ value_json.plate_text | default('Unbekannt') }}"
        json_attributes:
          - confidence
          - vehicle_type
          - vehicle_color
          - vehicle_color_hex
          - vehicle_color_rgb
          - plate_country
          - plate_country_display
          - plate_country_prob
          - timestamp
          - source

  - resource: http://192.168.1.240:8087/api/latest/person
    scan_interval: 5
    sensor:
      - name: PlateVision Letzte Person
        unique_id: platevision_last_person
        value_template: >-
          {% if value_json.success %}
            {{ value_json.timestamp | default('erkannt') }}
          {% else %}
            keine
          {% endif %}
        json_attributes:
          - confidence
          - direction
          - counted
          - event_type
          - source
          - image_url
          - timestamp

  - resource: http://192.168.1.240:8087/api/dashboard/overview
    scan_interval: 10
    sensor:
      - name: PlateVision Dashboard Heute
        unique_id: platevision_dashboard_today
        value_template: "{{ value_json.today.raw_detections | default(0) }}"
        json_attributes:
          - today
          - stream
          - people

  - resource: http://192.168.1.240:8087/api/stream/status
    scan_interval: 10
    binary_sensor:
      - name: PlateVision Stream
        unique_id: platevision_stream_status
        value_template: "{{ value_json.status == 'running' and value_json.connected }}"
        device_class: connectivity
        json_attributes:
          - fps
          - frame_count
          - detection_count
          - resolution
          - error

# Abgeleitete Sensoren
template:
  - sensor:
      - name: PlateVision Fahrzeugtyp
        unique_id: platevision_vehicle_type
        state: "{{ state_attr('sensor.platevision_kennzeichen', 'vehicle_type') | default('Unbekannt') }}"
        icon: >-
          {% set v = states('sensor.platevision_fahrzeugtyp') | lower %}
          {% if 'lkw' in v or 'truck' in v %} mdi:truck
          {% elif 'bus' in v %} mdi:bus
          {% elif 'motor' in v %} mdi:motorbike
          {% elif 'fahrrad' in v or 'bicycle' in v %} mdi:bicycle
          {% else %} mdi:car
          {% endif %}

      - name: PlateVision Fahrzeugfarbe
        unique_id: platevision_vehicle_color
        state: "{{ state_attr('sensor.platevision_kennzeichen', 'vehicle_color') | default('Unbekannt') }}"
        icon: mdi:palette

      - name: PlateVision Land
        unique_id: platevision_plate_country
        state: "{{ state_attr('sensor.platevision_kennzeichen', 'plate_country_display') | default('Unbekannt') }}"
        icon: mdi:earth

      - name: PlateVision Konfidenz
        unique_id: platevision_confidence
        state: "{{ (state_attr('sensor.platevision_kennzeichen', 'confidence') | float(0) * 100) | round(1) }}"
        unit_of_measurement: "%"
        icon: mdi:percent

      - name: PlateVision Zuletzt gesehen
        unique_id: platevision_last_seen
        state: >-
          {% set ts = state_attr('sensor.platevision_kennzeichen', 'timestamp') %}
          {% if ts %}
            {% set diff = (now().timestamp() - as_timestamp(ts)) | int %}
            {% if diff < 60 %}vor {{ diff }} Sekunden
            {% elif diff < 3600 %}vor {{ (diff / 60) | int }} Minuten
            {% elif diff < 86400 %}vor {{ (diff / 3600) | int }} Stunden
            {% else %}vor {{ (diff / 86400) | int }} Tagen
            {% endif %}
          {% else %}Unbekannt{% endif %}
        icon: mdi:history

      - name: PlateVision Quelle
        unique_id: platevision_source
        state: "{{ state_attr('sensor.platevision_kennzeichen', 'source') | default('Unbekannt') }}"
        icon: mdi:source-branch

      - name: PlateVision Kennzeichen heute
        unique_id: platevision_plates_today
        state: "{{ state_attr('sensor.platevision_dashboard_heute', 'today').raw_detections | default(0) }}"
        icon: mdi:counter

      - name: PlateVision Autos heute
        unique_id: platevision_unique_vehicles_today
        state: "{{ state_attr('sensor.platevision_dashboard_heute', 'today').unique_vehicles | default(0) }}"
        icon: mdi:car-multiple

      - name: PlateVision Durchfahrten heute
        unique_id: platevision_visits_today
        state: "{{ state_attr('sensor.platevision_dashboard_heute', 'today').traffic_visits | default(0) }}"
        icon: mdi:road-variant

      - name: PlateVision Wiederkehrer heute
        unique_id: platevision_repeat_vehicles_today
        state: "{{ state_attr('sensor.platevision_dashboard_heute', 'today').repeat_vehicles | default(0) }}"
        icon: mdi:car-clock

      - name: PlateVision Personen heute
        unique_id: platevision_people_today
        state: "{{ state_attr('sensor.platevision_dashboard_heute', 'today').people_counted | default(0) }}"
        icon: mdi:walk

# Kameras
camera:
  - platform: generic
    name: PlateVision Kennzeichen Bild
    still_image_url: http://192.168.1.240:8087/api/latest/plate/image
    verify_ssl: false

  - platform: generic
    name: PlateVision Fahrzeug Bild
    still_image_url: http://192.168.1.240:8087/api/latest/vehicle/image
    verify_ssl: false

  - platform: generic
    name: PlateVision Person Bild
    still_image_url: http://192.168.1.240:8087/api/latest/person/image
    verify_ssl: false

  - platform: mjpeg
    name: PlateVision Live Stream
    mjpeg_url: http://192.168.1.240:8087/api/stream/feed
    verify_ssl: false

  - platform: generic
    name: PlateVision Snapshot
    still_image_url: http://192.168.1.240:8087/api/stream/snapshot
    verify_ssl: false

rest_command:
  platevision_stream_start:
    url: http://192.168.1.240:8087/api/stream/start
    method: POST

  platevision_stream_stop:
    url: http://192.168.1.240:8087/api/stream/stop
    method: POST

  platevision_models_reload:
    url: http://192.168.1.240:8087/api/models/reload
    method: POST
